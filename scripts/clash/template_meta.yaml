mixed-port: 7890
allow-lan: true
external-controller: 0.0.0.0:9090
mode: Rule
log-level: info
ipv6: true
tcp-concurrent: true
unified-delay: true
dns:
  enable: true
  ipv6: true
  prefer-h3: false
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - 119.29.29.29
    - 223.5.5.5
    - 1.1.1.1
    - 8.8.8.8
  nameserver-policy:
    'geosite:cn': system
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniffing:
    - tls
    - http
  force-domain:
    - +.openai.com
    - +.chatgpt.com
    - +.anthropic.com
    - +.claude.ai
    - +.x.ai
    - +.grok.x.ai
    - +.perplexity.ai
    - +.pplx.ai
    - +.cohere.ai
    - +.cohere.com
    - +.mistral.ai
    - +.together.ai
    - +.together.xyz
    - +.openrouter.ai
    - +.huggingface.co
    - +.stability.ai
    - +.replicate.com
  skip-domain:
    - msftconnecttest.com
    - msftncsi.com
proxies: null
proxy-groups:
  - name: 默认节点
    type: select
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/liuliang(5).png
